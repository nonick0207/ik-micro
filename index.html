<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Микроэкономика - 2 курс</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2433;--mut:#6b7587;--bd:#dbe1ee;--pri:#3b5bdb;--ok:#2f9e44;--okb:#e6f6ea;--er:#e03131;--erb:#fdecec}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2030;--tx:#e8ecf5;--mut:#9aa5ba;--bd:#2c3550;--pri:#6f8cff;--ok:#51cf66;--okb:#16301e;--er:#ff6b6b;--erb:#381a1a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
.w{max-width:760px;margin:0 auto;padding:20px 14px 40px}
h1{margin:6px 0 2px;font-size:28px}.sub{color:var(--mut);margin:0 0 16px}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 14px}
button.on,.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:14px}
.stats span{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:5px 10px}
.bar{height:6px;background:var(--bd);border-radius:4px;margin-bottom:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.q{font-size:18px;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 13px}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.er{background:var(--erb);border-color:var(--er)}
.opt:disabled{cursor:default;color:var(--tx)}
.act{display:flex;gap:8px;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.hide{display:none}.big{font-size:42px;font-weight:700;margin:6px 0}
.err{border-top:1px solid var(--bd);padding:10px 0;font-size:14px}.err b{color:var(--ok)}
</style>
</head>
<body>
<div class="w">
<h1>Микроэкономика</h1>
<p class="sub">ИК вопросы • Тест для 2 курса</p>
<div class="modes" id="modes">
<button data-n="0" class="on">Все вопросы</button><button data-n="50">50 вопросов</button><button data-n="25">25 вопросов</button>
</div>
<div id="quiz">
<div class="stats"><span id="sN"></span><span>Правильно: <b id="sOk">0</b></span><span>Ошибка: <b id="sEr">0</b></span><span>Без ответа: <b id="sNo">0</b></span></div>
<div class="bar"><i id="bar"></i></div>
<div class="card"><p class="q" id="q"></p><div id="opts"></div>
<div class="act"><button id="skip">Пропустить</button><button id="fin">Завершить тест</button><button id="next" class="pri hide">Далее</button></div></div>
</div>
<div id="res" class="card hide">
<h2>Тест завершен!</h2><div class="big" id="score"></div><p id="pct" class="sub"></p>
<div id="errs"></div><div class="act"><button class="pri" id="again">Начать новый тест</button></div>
</div>
</div>
<script>
const DATA=[{"q":"Какие проблемы не рассматривает микроэкономика?","o":["проблемы межгосударственных отношений","проблемы полезности","проблемы стоимости","проблемы затрат"]},{"q":"В зависимости от подхода к объяснению поведения отдельных экономических субъектов как подразделяется микроэкономика?","o":["на позитивную и нормативную","на негативную и нормативную","на негативную и позитивную","на нормативную и плановую"]},{"q":"Все микроэкономические выборы осуществляются в рамках","o":["двух моделей","четырех моделей","пяти моделей","десяти моделей"]},{"q":"Все микроэкономические выборы осуществляются в рамках каких моделей?","o":["иерархической модели и модели стихийного порядка","внутренней и внешней модели","открытой и закрытой модели","краткосрочной и долгосрочной модели"]},{"q":"Все микроэкономические выборы, осуществляемые в рамках иерархической модели выбора, характеризуется тем,","o":["что индивидуальные действия людей, следовательно, и их выборы подчинены указаниям, инструкциям и распоряжениям центральной власти","что общие действия людей, следовательно, и их выборы подчинены указаниям, инструкциям и распоряжениям центральной власти","что действия и выборы индивидуумов приспосабливаются к реальным условиям, основываясь на информации и стимулах своего непосредственного окружения","что действия и выборы государств приспосабливаются к реальным условиям, основываясь на информации и стимулах своего непосредственного окружения"]},{"q":"Все микроэкономические выборы осуществляемые в рамках модели стихийного порядка, характеризуется тем,","o":["что действия и выборы индивидуумов приспосабливаются к реальным условиям, основываясь на информации и стимулах своего непосредственного окружения","что общие действия людей, следовательно, и их выборы подчинены указаниям, инструкциям и распоряжениям центральной власти","что действия и выборы государств приспосабливаются к реальным условиям, основываясь на информации и стимулах своего непосредственного окружения","что индивидуальные действия людей, следовательно, и их выборы подчинены указаниям, инструкциям и распоряжениям центральной власти"]},{"q":"Система выборов в микроэкономике сводится к трём вопросам:","o":["что? как? для кого?","что? где? когда?","что? кто? каким образом?","что? к чему? кому?"]},{"q":"Выбор «как» всегда связан:","o":["с проблемой эффективности производства","с распределением произведённой вновь созданной стоимости","с ограниченностью производительных ресурсов","с ограниченностью потребностей"]},{"q":"Выбор «для кого», связан:","o":["с распределением произведённой вновь созданной стоимости","с проблемой эффективности производства","с ограниченностью производительных ресурсов","с ограниченностью потребностей"]},{"q":"Микроэкономика, изучающая факты и зависимости между этими фактами и отвечающий на вопрос: что есть или может быть называется:","o":["позитивной","нормативной","негативной","плановой"]},{"q":"Микроэкономика, предлагающая рецепты действий, определяющая, какие условия экономики желательны или нежелательны, и отвечающая на вопрос: что должно быть называется","o":["нормативной","позитивной","негативной","плановой"]},{"q":"Закон спроса предполагает","o":["когда цена товара падает, объем планируемых покупок растет","если доходы у потребителей растут, они обычно покупают больше товаров","кривая спроса обычно имеет положительный наклон","превышение предложения над спросом вызовет снижение цены"]},{"q":"Закон предложения, если цены растут, а прочие условия неизменны, проявляется","o":["в росте объема предложения","в снижении предложения","в росте предложения","в падении объема предложения"]},{"q":"Чем можно объяснить сдвиг кривой спроса на товар Х","o":["вкусы потребителей вызвали интерес к товару Х, и поэтому они хотят покупать его при любой данной цене больше, чем раньше","цена товара Х выросла, и как следствие этого потребители решили меньше покупать этого товара","предложение товара Х по некоторой причине уменьшилось","цена товара Х упала, поэтому потребители "увеличится общее количество товара","цена повысится","цена остается стабильной","благосостояние общества возрастает"]},{"q":"Если цена товара ниже точки пересечения кривой спроса и кривой предложения, то возникнет:","o":["дефицит","избыток","равновесие","ничего не возникнет"]},{"q":"Функция спроса на штучный товар имеет вид Qd=60-3Р, функция предложения Qs=3Р- 30. Равновесное количество составило:","o":["15","30","60","90"]},{"q":"Функция спроса на штучный товар имеет вид Qd=100-3Р, функция предложения Qs=3Р- 20. Равновесная цена составила:","o":["20","30","60","100"]},{"q":"В каком случае модели Вальраса и Маршалла приводят к одному и тому же устойчивому положению равновесия","o":["когда кривая спроса имеет отрицательный, а кривая предложения - положительный наклон","когда и кривая спроса, и кривая предложения имеет положительный наклон","когда и кривая спроса и кривая предложения имеет отрицательный наклон","никогда"]},{"q":"Снижение цены стирального порошка на 5% вызвало увеличение спроса на него на 10%. Показатель эластичности будет равен:","o":["2","1,5","1","0,5"]},{"q":"Показатель ценовой эластичности спроса для всех товаров является:","o":["отрицательной величиной","положительной величиной","величиной равной 1","величиной равной 0"]},{"q":"Если коэффициент ценовой эластичности спроса больше 1, то","o":["спрос относительно эластичен","спрос абсолютно эластичен","спрос относительно неэластичен","спрос абсолютно неэластичен"]},{"q":"Если коэффициент ценовой эластичности спроса меньше 1, то","o":["спрос относительно неэластичен","спрос абсолютно эластичен","спрос относительно эластичен","спрос абсолютно неэластичен"]},{"q":"Перекрестная эластичность спроса характеризует реакцию?","o":["изменение цены одного товара на изменение величины спроса на другой товар","цены одного товара на изменение цены другого товара","цены одного товара на изменение предложения другого товара","величины спроса одного товара на изменение спроса на другой товар"]},{"q":"Если однопроцентное сокращение цены на товар приводит к двухпроцентному увеличению объема спроса на него, то этот спрос:","o":["эластичный","неэластичный","единичной эластичности","нет правильного ответа"]},{"q":"Если цена товара неэластичного спроса выросла с 700 тысяч сум до 800 тысяч сум, то выручка:","o":["выросла","сократилась","осталась неизменной","нет правильного ответа"]},{"q":"Если любое количество товара продается по одинаковой цене, то спрос на этот товар является:","o":["абсолютно эластичным","абсолютно неэластичным","относительно неэластичным","oтносительно эластичным"]},{"q":"Известно, что цена блага Х равна 2 ден. ед., а цена блага Y равна 3, доход потребителя составляет 200 ден. ед. Функция спроса потребителя на благо Х имеет вид: Qd=50-15Рх-8Ру+0,05I. Чему равна величина спроса?","o":["6","10","24","30"]},{"q":"Какие значения может принимать эластичность спроса по доходу?","o":["положительные, отрицательные и равные 0","только отрицательные","только положительные","положительные – для взаимодополняющих и отрицательные – для товаров-заменителей"]},{"q":"Если потребителям удастся заставить политиков принять закон, отвечающий интересам покупателей","o":["правительство установит официальный максимальный предел цены, который называется «потолком» (верхним пределом) цены","правительство установит официальный минимальный предел цены, который называется «полом» (нижним пределом) цены","правительство установит официальный максимальный предел цены, который называется «полом» (нижним пределом) цены","правительство установит официальный минимальный предел цены, который называется «потолком» (верхним пределом) цены"]},{"q":"Если производители убедят политиков принять закон, отвечающий их интересам","o":["правительство установит официальный минимальный предел цены, который называется «полом» (нижним пределом) цены","правительство установит официальный максимальный предел цены, который называется «потолком» (верхним пределом) цены","правительство установит официальный максимал const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const PIN=/нет правильн|все перечисленн|все вышеперечисленн|все вышеуказанн/i;
let mode=0,set=[],i=0,ok=0,er=0,no=0,wrong=[],done=false;
function start(){
  set=shuf(DATA);if(mode)set=set.slice(0,mode);
  i=0;ok=er=no=0;wrong=[];
  $('res').classList.add('hide');$('quiz').classList.remove('hide');show();
}
function show(){
  done=false;const c=set[i];
  $('q').textContent=c.q;
  let o=c.o.map((t,k)=>({t,r:k===0}));
  const last=o[o.length-1];
  if(!last.r&&PIN.test(last.t)){o=shuf(o.slice(0,-1));o.push(last)}else o=shuf(o);
  const box=$('opts');box.innerHTML='';
  o.forEach(x=>{const b=document.createElement('button');b.className='opt';b.textContent=x.t;b.onclick=()=>pick(b,x,o);b._x=x;box.appendChild(b)});
  $('next').classList.add('hide');$('skip').classList.remove('hide');
  upd();
}
function upd(){
  $('sN').textContent='Вопрос: '+(i+1)+'/'+set.length;
  $('sOk').textContent=ok;$('sEr').textContent=er;$('sNo').textContent=no;
  $('bar').style.width=(i/set.length*100)+'%';
}
function pick(b,x){
  if(done)return;done=true;
  [...$('opts').children].forEach(e=>{e.disabled=true;if(e._x.r)e.classList.add('ok')});
  if(x.r)ok++;else{er++;b.classList.add('er');wrong.push(set[i])}
  $('skip').classList.add('hide');$('next').classList.remove('hide');
  $('next').textContent=i===set.length-1?'Результат':'Далее';upd();
}
function next(){if(i>=set.length-1)return finish();i++;show()}
$('next').onclick=next;
$('skip').onclick=()=>{no++;if(i>=set.length-1){return finish()}i++;show()};
$('fin').onclick=finish;
function finish(){
  no+=Math.max(0,set.length-ok-er-no);
  $('quiz').classList.add('hide');$('res').classList.remove('hide');
  $('score').textContent=ok+'/'+set.length;
  $('pct').textContent='Правильно: '+ok+' • Ошибок: '+er+' • Без ответа: '+no+' • '+Math.round(ok/set.length*100)+'%';
  $('errs').innerHTML=wrong.length?'<h3>Работа над ошибками</h3>':'';
  wrong.forEach(c=>{const d=document.createElement('div');d.className='err';
    d.innerHTML='<div></div><b></b>';d.firstChild.textContent=c.q;d.lastChild.textContent='Правильный ответ: '+c.o[0];$('errs').appendChild(d)});
}
$('again').onclick=start;
$('modes').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  [...$('modes').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=+b.dataset.n;start()};
start();
